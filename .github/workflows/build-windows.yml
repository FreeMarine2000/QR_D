name: Build Windows EXE

on:
  push:
    branches: [ "main" ] # Triggers when you push to the main branch

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Use a stable Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install qrcode pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile qr_generator.py

    - name: Upload the EXE
      uses: actions/upload-artifact@v4
      with:
        name: qr-generator-windows
        path: dist/qr_generator.exe